
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webinar Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2563eb;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            width: 80%;
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ddd;
        }

        h2 {
            color: #2563eb;
            text-align: center;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 12px;
            border: none;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>Join Our Webinar</h1>
        <p>Learn, Connect, and Grow with Experts</p>
    </header>

    <div class="container">

        <h2>Webinar Registration</h2>

        <p>
            Discover new skills and gain valuable knowledge
            from industry experts.
        </p>

        <p><strong>Date:</strong> November 20, 2026</p>
        <p><strong>Time:</strong> 8:00 PM</p>

        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" placeholder="Enter your phone number">

            <button type="submit">Register Now</button>
        </form>

    </div>

    <footer>
        &copy; 2026 Webinar Event. All rights reserved.
    </footer>

</body>
</html>
